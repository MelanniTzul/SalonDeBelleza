services:
  mysql:
    image: mysql:8.4
    container_name: salon-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?}
      MYSQL_DATABASE: ${DB_NAME:?}
      TZ: America/Guatemala
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:?}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
