spring:
  application:
    name: salon-api

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:salondebellezafamiliar}?useSSL=false&serverTimezone=America/Guatemala&allowPublicKeyRetrieval=true
    username: ${DB_USER:salon_user}
    password: ${DB_PASSWORD:salon_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # el esquema lo controla Flyway, no Hibernate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:cambia-este-valor-en-produccion-por-una-clave-larga-y-secreta}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:10}
  uploads:
    dir: ${UPLOADS_DIR:uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc:
  swagger-ui:
    path: /docs

logging:
  level:
    com.salondebellezafamiliar: DEBUG